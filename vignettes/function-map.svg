  <text x="24" y="30" font-size="17" font-weight="700" fill="#1b2430">EEAaq: how the functions fit together</text>
  <text x="24" y="50" font-size="11" fill="#6b7480">Blue boxes are exported functions, white boxes internal ones, sand boxes data outside the package and the objects the functions return.</text>
  <text x="24" y="64" font-size="11" fill="#6b7480">Blue arrows follow the data and the objects, grey arrows are function calls from caller to callee; dashed arrows are the maintainers' tools.</text>
  <text x="38" y="78" font-size="11" fill="#6b7480">reads the metadata in Support_files/ through EEAaq_get_dataframe(), so it needs an internet connection</text>
