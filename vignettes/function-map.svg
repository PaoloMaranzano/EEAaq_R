  <text x="24" y="748" class="foot">EEAaq_get_data() splits the period with handle_dates() across Airbase (until 2012), E1a (2013-2024) and E2a (from 2025),</text>
  <text x="24" y="762" class="foot">asks the API for the parquet files of the chosen stations and reads them with arrow. The builders are not called by the exported functions:</text>
